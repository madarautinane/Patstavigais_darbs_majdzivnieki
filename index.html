<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Mājdzīvnieki</title>

        
    <style>
        body {
            margin: 0;
            background-color: #d3d3d3;
            font-family: Arial, sans-serif;
        }

        .menu {
            display: flex;
            align-items: center;
            padding: 20px;
            background-color: #333;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Kreisā puse */
        .left {
            margin-right: auto;
        }

        /* Vidus sadaļas */
        .center a {
            margin: 0 20px;
        }

        /* Labā puse */
        .right {
            margin-left: auto;
        }
    </style>
</head>

<body>

    <div class="menu">
        <a href="#" class="left">Sākums</a>

        <div class="center">
            <a href="#">Suņi</a>
            <a href="#">Kaķi</a>
        </div>

        <a href="#" class="right">Kontakti</a>
    </div>

</body>
</html>
